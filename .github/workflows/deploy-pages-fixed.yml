name: Deploy IPO Terminal Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R data scripts _site/
          cp ui-final-fix.js ui-hard-fix.js _site/
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('_site')
          html=(root/'index.html').read_text(encoding='utf-8')
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          missing=[]
          for ref in refs:
              p=ref.split('?',1)[0]
              if not p.startswith(('http://','https://','//')) and not (root/p).exists(): missing.append(p)
          if missing: raise SystemExit('Missing local scripts: '+', '.join(missing))
          for f in ('ipo-data.json','gmp.json','subscriptions.json','sme-ipos.json','live-news.json','live-filings.json'):
              p=root/'data'/f
              if not p.exists() or not p.stat().st_size: raise SystemExit('Missing/empty data file: '+str(p))
              json.loads(p.read_text(encoding='utf-8'))
          print('SITE HEALTH OK')
          PY
      - name: Validate JavaScript
        run: |
          node --check _site/ui-final-fix.js
          node --check _site/ui-hard-fix.js
          node --check _site/scripts/ipo-live-loader.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
