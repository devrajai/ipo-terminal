name: IPO daily tools

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ipo-daily-tools
  cancel-in-progress: false

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build IPO calendar (.ics)
        run: python3 scripts/make_calendar.py

      - name: Log today's forecasts
        run: python3 scripts/log_forecasts.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipo-calendar.ics data/forecast-log.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: daily IPO calendar + forecast log [skip ci]"
            git push
          fi
