name: Apply IPO video knowledge

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-video-knowledge
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply transcript knowledge and current GMP fallback
        run: python scripts/apply_video_knowledge.py
      - name: Commit knowledge-backed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ipo-data.json
          git diff --cached --quiet || git commit -m 'chore: apply IPO video knowledge'
          git push
