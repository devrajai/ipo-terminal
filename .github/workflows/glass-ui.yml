name: Apply liquid glass UI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  glass-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply liquid glass styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* IPO-TERMINAL-LIQUID-GLASS-V1 */'
          if marker in s:
              print('Liquid glass styling already applied')
              raise SystemExit(0)
          css = r'''
          /* IPO-TERMINAL-LIQUID-GLASS-V1 */
          :root{
            --bg:#090a0c;--card:rgba(35,37,41,.58);--card2:rgba(55,58,64,.48);--bd:rgba(255,255,255,.15);
            --tx:#f7f8fa;--tx2:#c7cbd1;--tx3:#9298a2
          }
          .light{
            --bg:#eef1f5;--card:rgba(255,255,255,.58);--card2:rgba(255,255,255,.46);--bd:rgba(40,48,60,.14);
            --tx:#172033;--tx2:#536071;--tx3:#707b8b
          }
          html,body{background:var(--bg)!important}
          body{background:radial-gradient(circle at 15% 0%,rgba(115,125,145,.13),transparent 34%),radial-gradient(circle at 85% 10%,rgba(91,116,255,.10),transparent 30%),var(--bg)!important;color:var(--tx)!important}
          .hdr,.hbtns{background:rgba(15,17,20,.55)!important;background-color:color-mix(in srgb,var(--bg) 64%,transparent)!important;backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border-color:var(--bd)!important}
          .light .hdr,.light .hbtns{background:rgba(245,247,250,.62)!important;background-color:color-mix(in srgb,var(--bg) 72%,transparent)!important}
          .theme-btn{position:fixed!important;right:12px!important;top:12px!important;width:34px!important;height:34px!important;z-index:100!important;border:1px solid rgba(255,255,255,.20)!important;background:rgba(70,73,80,.48)!important;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 8px 28px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.18)!important}
          .light .theme-btn{background:rgba(255,255,255,.60)!important;color:#172033!important;border-color:rgba(40,48,60,.14)!important;box-shadow:0 8px 28px rgba(70,80,100,.16),inset 0 1px rgba(255,255,255,.8)!important}
          .kpi-card,.hb,.panel,.panel-title,.ipo-card,.ipo-stats div,.gl-card,.broker-card,.broker-grid div,.gloss-card,.tip-tab,.allot-wrap,.news-item,.doc-row,.ipo-table th{background:linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.035))!important;border-color:var(--bd)!important;box-shadow:inset 0 1px rgba(255,255,255,.12),0 8px 28px rgba(0,0,0,.10)!important;backdrop-filter:blur(20px) saturate(145%);-webkit-backdrop-filter:blur(20px) saturate(145%)}
          .light .kpi-card,.light .hb,.light .panel,.light .panel-title,.light .ipo-card,.light .ipo-stats div,.light .gl-card,.light .broker-card,.light .broker-grid div,.light .gloss-card,.light .tip-tab,.light .allot-wrap,.light .news-item,.light .doc-row,.light .ipo-table th{background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(220,226,235,.38))!important;box-shadow:inset 0 1px rgba(255,255,255,.90),0 8px 26px rgba(75,85,105,.10)!important}
          .hb{color:var(--tx2)!important;border:1px solid rgba(255,255,255,.16)!important;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
          .light .hb{border-color:rgba(40,48,60,.14)!important}
          .hb:hover,.hb:focus-visible{transform:translateY(-1px);box-shadow:inset 0 1px rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.14)!important}
          .hb.active{color:#fff!important;background:rgba(255,255,255,.16)!important;border-color:rgba(255,255,255,.28)!important}
          .light .hb.active{color:#172033!important;background:rgba(255,255,255,.72)!important;border-color:rgba(40,48,60,.16)!important}
          .hb:nth-child(1){color:#ff9a3d!important}.hb:nth-child(2){color:#fff!important}.light .hb:nth-child(2){color:#172033!important}.hb:nth-child(4){color:#57dc83!important}
          .kpi-card{color:var(--tx)!important}.kpi-card.open{background:linear-gradient(135deg,rgba(255,153,68,.38),rgba(255,120,40,.12))!important}.kpi-card.upc{background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(190,198,210,.10))!important}.kpi-card.closed{background:linear-gradient(135deg,rgba(65,210,120,.34),rgba(30,150,80,.10))!important}
          .status.open{background:rgba(255,137,48,.72)!important}.status.upcoming{background:rgba(255,255,255,.22)!important;color:var(--tx)!important}.status.closed{background:rgba(50,190,105,.70)!important}
          .apply-btn,.big-link{background:linear-gradient(135deg,rgba(74,137,255,.90),rgba(80,104,220,.70))!important;box-shadow:inset 0 1px rgba(255,255,255,.28),0 8px 22px rgba(45,90,210,.20)!important}
          .close-x{background:rgba(220,55,65,.72)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
          .back-top{background:rgba(55,58,64,.62)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd)!important}
          .light .back-top{background:rgba(255,255,255,.72)!important;color:#172033!important}
          .news-item{border-left-color:#5d8dff!important}
          @media(max-width:699px){
            .hbtns{position:sticky;top:0;z-index:90;touch-action:pan-x;overscroll-behavior-x:contain}
            .hb,.theme-btn,.close-x,.tip-tab,.gloss-card,.apply-btn,.big-link{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
            .hb{min-height:40px}
            .panel{position:relative;z-index:10}
          }
          '''
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: liquid glass dark and light themes"
          git push
