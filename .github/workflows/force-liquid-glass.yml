name: Force visible liquid glass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-liquid-glass.yml'

permissions:
  contents: write

jobs:
  glass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visible glass layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* IPO-TERMINAL-VISIBLE-LIQUID-GLASS-V2 */'
          if marker in s:
              raise SystemExit('already applied')
          css=r'''
          /* IPO-TERMINAL-VISIBLE-LIQUID-GLASS-V2 */
          html{background:#08090b!important}
          body{min-height:100vh!important;background:
            radial-gradient(650px 420px at 8% 4%,rgba(91,116,255,.18),transparent 68%),
            radial-gradient(560px 420px at 92% 12%,rgba(170,92,255,.14),transparent 68%),
            radial-gradient(700px 500px at 50% 100%,rgba(70,170,255,.08),transparent 70%),#08090b!important;
            background-attachment:fixed!important}
          .light body,.light{background:
            radial-gradient(650px 420px at 8% 4%,rgba(95,130,255,.16),transparent 68%),
            radial-gradient(560px 420px at 92% 12%,rgba(175,105,255,.13),transparent 68%),
            radial-gradient(700px 500px at 50% 100%,rgba(75,160,235,.10),transparent 70%),#e9edf3!important;
            background-attachment:fixed!important}
          .hdr,.hbtns{background:rgba(24,26,31,.42)!important;background-image:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.025))!important;backdrop-filter:blur(30px) saturate(180%)!important;-webkit-backdrop-filter:blur(30px) saturate(180%)!important;box-shadow:inset 0 1px rgba(255,255,255,.18),0 12px 38px rgba(0,0,0,.20)!important}
          .light .hdr,.light .hbtns{background:rgba(255,255,255,.38)!important;background-image:linear-gradient(135deg,rgba(255,255,255,.78),rgba(205,214,228,.22))!important;box-shadow:inset 0 1px rgba(255,255,255,.95),0 12px 38px rgba(55,70,95,.13)!important}
          .panel,.ipo-card,.gl-card,.broker-card,.gloss-card,.allot-wrap,.news-item,.doc-row,.kpi-card,.tip-tab,.ipo-stats div,.broker-grid div{position:relative!important;overflow:hidden!important;background:rgba(255,255,255,.075)!important;background-image:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.035))!important;border:1px solid rgba(255,255,255,.18)!important;backdrop-filter:blur(28px) saturate(180%)!important;-webkit-backdrop-filter:blur(28px) saturate(180%)!important;box-shadow:inset 0 1px rgba(255,255,255,.18),inset 0 -1px rgba(0,0,0,.16),0 14px 40px rgba(0,0,0,.16)!important}
          .light .panel,.light .ipo-card,.light .gl-card,.light .broker-card,.light .gloss-card,.light .allot-wrap,.light .news-item,.light .doc-row,.light .kpi-card,.light .tip-tab,.light .ipo-stats div,.light .broker-grid div{background:rgba(255,255,255,.48)!important;background-image:linear-gradient(135deg,rgba(255,255,255,.88),rgba(205,214,228,.22))!important;border-color:rgba(45,58,78,.15)!important;box-shadow:inset 0 1px rgba(255,255,255,.98),inset 0 -1px rgba(50,60,75,.06),0 14px 40px rgba(55,70,95,.13)!important}
          .panel::before,.ipo-card::before,.gl-card::before,.broker-card::before,.gloss-card::before,.allot-wrap::before,.news-item::before,.doc-row::before,.kpi-card::before,.tip-tab::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.20),transparent 28%,transparent 68%,rgba(125,150,255,.08));opacity:.8}
          .light .panel::before,.light .ipo-card::before,.light .gl-card::before,.light .broker-card::before,.light .gloss-card::before,.light .allot-wrap::before,.light .news-item::before,.light .doc-row::before,.light .kpi-card::before,.light .tip-tab::before{background:linear-gradient(115deg,rgba(255,255,255,.72),transparent 30%,transparent 68%,rgba(105,130,220,.08))}
          .panel>* ,.ipo-card>* ,.gl-card>* ,.broker-card>* ,.gloss-card>* ,.allot-wrap>* ,.news-item>* ,.doc-row>* ,.kpi-card>* ,.tip-tab>*{position:relative;z-index:1}
          .hb{background:rgba(255,255,255,.055)!important;border:1px solid rgba(255,255,255,.20)!important;backdrop-filter:blur(22px) saturate(180%)!important;-webkit-backdrop-filter:blur(22px) saturate(180%)!important;box-shadow:inset 0 1px rgba(255,255,255,.20),0 7px 24px rgba(0,0,0,.14)!important}
          .light .hb{background:rgba(255,255,255,.43)!important;border-color:rgba(45,58,78,.16)!important;box-shadow:inset 0 1px rgba(255,255,255,.95),0 7px 24px rgba(55,70,95,.11)!important}
          .hb.active{background:rgba(255,255,255,.19)!important;box-shadow:inset 0 1px rgba(255,255,255,.30),0 8px 28px rgba(0,0,0,.18)!important}
          .light .hb.active{background:rgba(255,255,255,.70)!important}
          .theme-btn{backdrop-filter:blur(24px) saturate(190%)!important;-webkit-backdrop-filter:blur(24px) saturate(190%)!important}
          @media(max-width:699px){.hbtns{background:rgba(20,22,27,.48)!important}.light .hbtns{background:rgba(245,247,250,.48)!important}}
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: make liquid glass visibly frosted"
          git push
