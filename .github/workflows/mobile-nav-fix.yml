name: Mobile nav and panel behavior fix

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  fix-mobile-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject mobile nav and panel behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* IPO-TERMINAL-MOBILE-NAV-FIX-V1 */'
          if marker in s:
              print('Mobile nav fix already present')
              raise SystemExit(0)
          css = r'''
          /* IPO-TERMINAL-MOBILE-NAV-FIX-V1 */
          .hbtns{transition:transform .24s ease,opacity .20s ease!important;will-change:transform,opacity!important}
          .hbtns.nav-hidden{transform:translateY(calc(-100% - 8px))!important;opacity:0!important;pointer-events:none!important}
          @media(max-width:699px){.hbtns{top:0!important}.hbtns.nav-hidden{visibility:hidden!important}}
          '''.replace('\n','')
          js = r'''
          <script>
          (function(){
            "use strict";
            function norm(s){return (s||"").toLowerCase().replace(/\d+/g,"").replace(/[^a-z0-9]+/g,"").trim();}
            function titleOf(p){var t=p.querySelector(".panel-title");return t?t.textContent:"";}
            function findPanel(btn){
              var raw=btn.getAttribute("data-panel")||btn.getAttribute("aria-controls")||"";
              if(raw){var by=document.getElementById(raw.replace(/^#/,""));if(by)return by;}
              var label=norm(btn.textContent);
              var aliases={open:["open","openipo","liveipo"],upcoming:["upcoming","upcomingipo"],listed:["listed","listedipo"],compare:["compare","comparison"],allotment:["allotment","allot"],news:["news","iponews"],rhpdrhp:["rhp","drhp","rhpdrhp","documents"],tips:["tips","ipotips"],glossary:["glossary"]};
              var keys=aliases[label]||[label];
              var panels=[].slice.call(document.querySelectorAll(".panel"));
              for(var i=0;i<panels.length;i++){var k=norm(titleOf(panels[i]));for(var j=0;j<keys.length;j++){var q=norm(keys[j]);if(q && (k.indexOf(q)>=0 || q.indexOf(k)>=0))return panels[i];}}
              return null;
            }
            function closeOthers(target){document.querySelectorAll(".panel.show").forEach(function(p){if(p!==target)p.classList.remove("show");});}
            function syncButton(btn){
              var target=findPanel(btn);if(!target)return;
              var wasOpen=target.classList.contains("show");
              setTimeout(function(){
                if(wasOpen){target.classList.remove("show");btn.classList.remove("active");}
                else{closeOthers(target);target.classList.add("show");btn.classList.add("active");try{target.scrollIntoView({behavior:"smooth",block:"nearest"});}catch(e){}}
              },0);
            }
            document.addEventListener("click",function(e){
              var btn=e.target.closest(".hb");
              if(btn){syncButton(btn);}
            },true);
            var lastY=window.scrollY||0, ticking=false;
            function navScroll(){
              var nav=document.querySelector(".hbtns");if(!nav){ticking=false;return;}
              var y=window.scrollY||0, delta=y-lastY;
              if(y<12){nav.classList.remove("nav-hidden");}
              else if(Math.abs(delta)>3){if(delta>0)nav.classList.add("nav-hidden");else nav.classList.remove("nav-hidden");}
              lastY=y;ticking=false;
            }
            window.addEventListener("scroll",function(){if(!ticking){ticking=true;requestAnimationFrame(navScroll);}}, {passive:true});
            window.addEventListener("resize",function(){var n=document.querySelector(".hbtns");if(n)n.classList.remove("nav-hidden");});
          })();
          </script>
          '''.replace('\n','')
          s = s.replace('</style>', css + '</style>', 1)
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: mobile nav hide on scroll and panel toggles"
          git push
