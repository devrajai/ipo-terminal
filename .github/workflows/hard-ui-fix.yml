name: Hard UI Interaction Fix
on:
  push:
    branches: [main]
    paths:
      - 'ui-hard-fix.js'
      - '.github/workflows/hard-ui-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject hard fix inline
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          js=Path('ui-hard-fix.js').read_text(encoding='utf-8')
          import re
          s=re.sub(r'<script id="ipo-hard-ui-fix">[\s\S]*?</script>\s*','',s)
          tag='<script id="ipo-hard-ui-fix">\n'+js+'\n</script>\n'
          if '</body>' not in s:
              raise SystemExit('No </body> marker found')
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ui-hard-fix.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make theme and mobile navigation reliable'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; git add index.html ui-hard-fix.js; git commit -m 'fix: make theme and mobile navigation reliable' || true; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
