name: Update IPO data

on:
  schedule:
    # Continuous background refresh: every 15 minutes, every day.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Backup existing data
        run: |
          set -e
          mkdir -p /tmp/ipo-backup
          for f in data/ipo-data.json data/gmp.json data/subscriptions.json data/sme-ipos.json data/terminal-state.json data/terminal-events.json data/live-news.json data/live-filings.json data/self-heal-health.json data/upcoming-ipo-filings.json; do
            if [ -s "$f" ]; then cp "$f" "/tmp/ipo-backup/$(basename "$f")"; fi
          done
      - name: Collect IPO data
        run: python scripts/update_data.py
      - name: Enrich free public IPO sources
        run: python scripts/enrich_public_sources.py
      - name: Enrich fundamentals and public RHP/DRHP evidence
        run: python scripts/enrich_fundamentals.py
      - name: Preserve embedded fundamentals and filing fallback
        run: python scripts/enrich_seed_fallback.py
      - name: Apply transcript knowledge and current-week GMP fallback
        run: python scripts/apply_video_knowledge.py
      - name: Apply latest supplied transcript evidence
        run: python scripts/apply_transcript_knowledge.py
      - name: Enrich GMP from IPOGuru when API key is available
        env:
          IPOGURU_API_KEY: ${{ secrets.IPOGURU_API_KEY }}
        run: python scripts/enrich_gmp_ipoguru.py
      - name: Refresh multi-source IPO news and verify RHP/DRHP links
        run: python scripts/refresh_live_content.py
      - name: Self-heal dates, import future SME IPOs and correct live status
        run: python scripts/self_heal.py
      - name: Generate GMP subscription and SME feature data
        run: python scripts/build_feature_data.py
      - name: Build future-proof terminal state and event stream
        run: python scripts/build_terminal_state.py
      - name: Validate and restore bad data
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          required=['ipo-data.json','gmp.json','subscriptions.json','sme-ipos.json']
          for name in required:
              p=Path('data')/name; b=Path('/tmp/ipo-backup')/name
              try:
                  if not p.exists() or p.stat().st_size == 0: raise ValueError('missing/empty')
                  d=json.loads(p.read_text(encoding='utf-8'))
                  if isinstance(d,list) and not d: raise ValueError('empty list')
                  print('OK',name)
              except Exception as e:
                  if b.exists() and b.stat().st_size>0:
                      p.write_bytes(b.read_bytes()); print('RESTORED',name,e)
                  else: raise
          for name in ['terminal-state.json','terminal-events.json','live-news.json','live-filings.json','self-heal-health.json','upcoming-ipo-filings.json']:
              p=Path('data')/name
              if p.exists(): json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Save last updated timestamp
        run: |
          echo "{\"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/last-updated.json
      - name: Commit updated terminal data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then echo 'No data changes.'; else git commit -m 'chore: auto-refresh live IPO data'; git push; fi
