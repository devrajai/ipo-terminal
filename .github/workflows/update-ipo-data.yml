name: Update IPO data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect IPO data
        run: python scripts/update_data.py

      - name: Enrich free public IPO sources
        run: python scripts/enrich_public_sources.py

      - name: Enrich GMP from IPOGuru when API key is available
        env:
          IPOGURU_API_KEY: ${{ secrets.IPOGURU_API_KEY }}
        run: python scripts/enrich_gmp_ipoguru.py

      - name: Build future-proof terminal state and event stream
        run: python scripts/build_terminal_state.py

      - name: Commit updated terminal data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ipo-data.json data/terminal-state.json data/terminal-events.json
          git diff --cached --quiet || git commit -m 'chore: update IPO terminal state'
          git push
