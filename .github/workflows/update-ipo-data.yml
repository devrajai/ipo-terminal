name: Update IPO data

on:
  schedule:
    # Run every 5 minutes. Offset from the top of the hour to reduce GitHub schedule congestion.
    - cron: '7-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Backup existing data
        run: |
          set -e
          mkdir -p /tmp/ipo-backup
          for f in data/ipo-data.json data/gmp.json data/subscriptions.json data/sme-ipos.json data/terminal-state.json data/terminal-events.json data/live-news.json data/live-filings.json data/self-heal-health.json data/upcoming-ipo-filings.json data/market-data.json data/last-updated.json; do
            if [ -s "$f" ]; then cp "$f" "/tmp/ipo-backup/$(basename "$f")"; fi
          done

      - name: Collect live IPO data from NSE/BSE/SEBI sources
        run: python scripts/update_data.py

      - name: Fetch live market data (India/world indices, commodities, FX)
        run: python scripts/fetch_market_data.py
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}

      - name: Enrich free public IPO sources
        run: python scripts/enrich_public_sources.py

      - name: Enrich fundamentals and public RHP/DRHP evidence
        run: python scripts/enrich_fundamentals.py

      - name: Preserve embedded fundamentals and filing fallback
        run: python scripts/enrich_seed_fallback.py

      - name: Apply transcript knowledge and current-week GMP fallback
        run: python scripts/apply_video_knowledge.py

      - name: Apply latest supplied transcript evidence
        run: python scripts/apply_transcript_knowledge.py

      - name: Enrich GMP from IPOGuru when API key is available
        env:
          IPOGURU_API_KEY: ${{ secrets.IPOGURU_API_KEY }}
        run: python scripts/enrich_gmp_ipoguru.py

      - name: Refresh recent IPO news and verify RHP/DRHP links
        run: python scripts/refresh_live_content.py

      - name: Self-heal dates, status and future SME IPOs
        run: python scripts/self_heal.py

      - name: Generate GMP, subscription and SME feature data
        run: python scripts/build_feature_data.py

      - name: Build future-proof terminal state and event stream
        run: python scripts/build_terminal_state.py

      - name: Validate generated data
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          required=['ipo-data.json','gmp.json','subscriptions.json','sme-ipos.json']
          for name in required:
              p=Path('data')/name
              if not p.exists() or p.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty {p}')
              d=json.loads(p.read_text(encoding='utf-8'))
              if isinstance(d,list) and not d:
                  raise SystemExit(f'Empty list: {p}')
              print('OK',name)
              for name in ['terminal-state.json','terminal-events.json','live-news.json','live-filings.json','self-heal-health.json','upcoming-ipo-filings.json']:
                  p=Path('data')/name
                  if p.exists(): json.loads(p.read_text(encoding='utf-8'))
          PY

      - name: Write refresh heartbeat
        run: |
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          now=dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z')
          Path('data/last-updated.json').write_text(json.dumps({
              'updated': now,
              'refresh_interval_minutes': 5,
              'source': 'GitHub Actions + NSE/BSE/SEBI public sources',
              'timezone': 'UTC'
          }, indent=2), encoding='utf-8')
          PY

      - name: Commit refreshed data
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'chore: auto-refresh live IPO data'
            git push
          fi
