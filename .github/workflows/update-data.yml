name: IPO Terminal - Automatic Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * 1-6'

permissions:
  contents: write

concurrency:
  group: ipo-terminal-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup verified data
        run: |
          mkdir -p /tmp/ipo-backup
          for f in data/ipos.json data/ipo-data.json data/listed.json data/gmp.json data/subscriptions.json data/sme-ipos.json data/drhp.json data/news.json data/sheet-fallback-health.json; do
            [ -f "$f" ] && cp "$f" "/tmp/ipo-backup/$(basename "$f")"
          done

      - name: Install optional Google Sheet fallback client
        if: ${{ secrets.GOOGLE_SHEET_ID != '' && secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: pip install -r requirements-google-sheets.txt

      - name: Run multi-source live collector
        run: |
          set +e
          python scripts/update_data.py
          rc=$?
          echo "collector_exit=$rc"
          python scripts/build_feature_data.py || true
          exit 0

      - name: Enrich missing IPO fields from public web
        run: |
          set +e
          python scripts/ipo_web_fallback.py
          echo "web_fallback_exit=$?"
          exit 0

      - name: Apply Google Sheet fallback for missing fields
        if: ${{ secrets.GOOGLE_SHEET_ID != '' && secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set +e
          python scripts/apply_sheet_fallback.py
          echo "sheet_fallback_exit=$?"
          exit 0

      - name: Build safe frontend IPO dataset
        run: |
          python <<'PY'
          import json, os, re, tempfile
          from datetime import datetime
          from pathlib import Path

          src=Path('data/ipo-data.json')
          out=Path('data/ipos.json')
          backup=Path('/tmp/ipo-backup/ipos.json')

          def date10(v):
              s=str(v or '').strip()
              for fmt in ('%d/%m/%y','%d/%m/%Y','%Y-%m-%d'):
                  try:return datetime.strptime(s,fmt).strftime('%Y-%m-%d')
                  except ValueError:pass
              m=re.search(r'(\d{1,2})\s*[-/]\s*(\d{1,2})\s*[-/]\s*(\d{2,4})',s)
              if m:
                  y=m.group(3); y=('20'+y) if len(y)==2 else y
                  return f'{y}-{int(m.group(2)):02d}-{int(m.group(1)):02d}'
              return ''

          def clean(v):
              return '—' if v in (None,'','-','—') else v

          def write_atomic(path,data):
              fd,tmp=tempfile.mkstemp(dir=str(path.parent),suffix='.json')
              with os.fdopen(fd,'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2)
              os.replace(tmp,path)

          rows=[]
          try:
              payload=json.loads(src.read_text(encoding='utf-8'))
              raw=payload.get('ipos',[]) if isinstance(payload,dict) else []
              for x in raw:
                  if not isinstance(x,dict) or not x.get('name'): continue
                  op=date10(x.get('open')); cl=date10(x.get('close')); li=date10(x.get('listing'))
                  if not op or not cl: continue
                  rows.append({
                    'name':x.get('name'),'open_date':op,'close_date':cl,'listing_date':li or '',
                    'close_time':'17:00','price_band':clean(x.get('price')),'lot_size':int(float(x['lot'])) if str(x.get('lot','')).isdigit() else clean(x.get('lot')),
                    'issue_size':clean(x.get('size')),'exchange':clean(x.get('exchange')),'board':clean(x.get('type')),
                    'gmp':clean(x.get('gmp')),'gmp_pct':clean(x.get('gmp_pct')),
                    'pe':clean(x.get('pe')),'pb':clean(x.get('pb')),'roe':clean(x.get('roe')),'roce':clean(x.get('roce')),'eps':clean(x.get('eps')),
                    'allotment_date':clean(x.get('allotment')),'refund_date':clean(x.get('refund')),'share_credit_date':clean(x.get('shares'))
                  })
          except Exception as e:
              print('frontend transform failed:',repr(e))

          unique={str(x['name']).strip().lower():x for x in rows}
          rows=list(unique.values())
          if len(rows)>=3:
              write_atomic(out,rows)
              print('frontend IPO dataset refreshed:',len(rows))
          elif backup.exists():
              out.write_text(backup.read_text(encoding='utf-8'),encoding='utf-8')
              print('kept previous verified frontend IPO dataset')
          else:
              print('no usable frontend dataset')
          PY

      - name: Validate and self-heal JSON
        run: |
          python <<'PY'
          import json, os, shutil
          files=['data/ipos.json','data/listed.json','data/drhp.json','data/news.json']
          for p in files:
              try:
                  with open(p,encoding='utf-8') as f:d=json.load(f)
                  if not isinstance(d,list) or (p.endswith('ipos.json') and not d): raise ValueError('invalid/empty')
                  print(p,'OK',len(d))
              except Exception as e:
                  b='/tmp/ipo-backup/'+os.path.basename(p)
                  if os.path.exists(b): shutil.copyfile(b,p); print(p,'restored from backup',e)
                  else: raise
          PY

      - name: Resolve and self-heal per-IPO links (RHP/DRHP + allotment)
        run: |
          set +e
          python scripts/link_health.py
          echo "link_health_exit=$?"
          exit 0

      - name: Save timestamp only after valid data
        run: echo '{"updated":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/last-updated.json

      - name: Commit verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: refresh live IPO dataset"
          git push
