name: IPO Terminal - Google Sheets Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * 1-6'

permissions:
  contents: read

jobs:
  sync:
    if: ${{ secrets.GOOGLE_SHEET_ID != '' && secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Sheets client
        run: pip install -r requirements-google-sheets.txt

      - name: Sync IPO data to Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/google_sheets_ipo_sync.py
