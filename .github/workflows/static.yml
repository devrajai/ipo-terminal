name: Deploy IPO Terminal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R data _site/data
          if [ -d scripts ]; then cp -R scripts _site/scripts; fi
          python <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          # Defensive removal of the retired Compare item/panel and footer SEBI label.
          s=re.sub(r'<button[^>]*data-section=["\']compare["\'][^>]*>.*?</button>','',s,flags=re.I|re.S)
          s=re.sub(r'<section[^>]*id=["\']section-compare["\'][^>]*>.*?</section>','',s,flags=re.I|re.S)
          s=re.sub(r'<a[^>]*>\s*SEBI\s*</a>','',s,flags=re.I|re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify site
        run: |
          set -e
          test -s _site/index.html
          test -s _site/data/ipos.json
          test -s _site/data/listed.json
          test -s _site/data/drhp.json
          test -s _site/data/news.json
          test -s _site/data/last-updated.json
          grep -q 'Promise.all' _site/index.html
          grep -q 'section.opened' _site/index.html
          grep -q 'india-date' _site/index.html
          grep -q 'Asia/Kolkata' _site/index.html
          grep -q 'nav-groups' _site/index.html
          grep -q 'IPO Status' _site/index.html
          grep -q 'Research &amp; Tools\|Research & Tools' _site/index.html
          grep -q 'nav-hidden' _site/index.html
          ! grep -q 'data-section="compare"' _site/index.html
          ! grep -q 'section-compare' _site/index.html
          ! grep -q '>SEBI<' _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
