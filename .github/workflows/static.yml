name: Deploy IPO Terminal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R data _site/data
          if [ -d scripts ]; then cp -R scripts _site/scripts; fi

          python <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<button[^>]*data-section=["\']brokers["\'][^>]*>.*?</button>','',s,flags=re.I|re.S)
          s=re.sub(r'<section[^>]*id=["\']section-brokers["\'][^>]*>.*?</section>','',s,flags=re.I|re.S)
          s=re.sub(r'<div class="subtitle">.*?</div>', '<div class="subtitle" id="live-date-time"></div>', s, count=1, flags=re.I|re.S)
          clock=r'''<style id="live-clock-style">#live-date-time{font-variant-numeric:tabular-nums;letter-spacing:.15px}</style>
          <script id="live-clock-script">
          (function(){
            function updateIndiaClock(){
              var e=document.getElementById('live-date-time');
              if(!e)return;
              var now=new Date();
              var parts=new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).formatToParts(now);
              var p={}; parts.forEach(function(x){if(x.type!=='literal')p[x.type]=x.value});
              e.textContent='Date: '+p.day+'/'+p.month+'/'+p.year+' • India: '+p.hour+':'+p.minute+':'+p.second+' '+p.dayPeriod;
            }
            updateIndiaClock();
            setInterval(updateIndiaClock,1000);
          })();
          </script>'''
          s=s.replace('</head>',clock+'</head>',1)
          navfix=r'''<style id="nav-scroll-fix">
          .nav-wrap{will-change:transform,max-height,opacity;transition:transform .22s ease,opacity .18s ease,max-height .22s ease,padding .22s ease,border-color .22s ease;overflow:hidden}
          .nav-wrap.nav-hidden{transform:translateY(calc(-100% - 4px));max-height:0!important;padding-top:0!important;padding-bottom:0!important;border-top-color:transparent!important;border-bottom-color:transparent!important;opacity:0;pointer-events:none}
          @media(max-width:699px){.nav-wrap{width:100%;}.nav-wrap.nav-hidden{box-shadow:none!important}}
          </style>
          <script id="nav-scroll-fix-script">
          (function(){
            function initNavScroll(){
              var nav=document.getElementById('nav-wrap')||document.querySelector('.nav-wrap');
              if(!nav)return;
              var lastY=window.scrollY||0;
              var ticking=false;
              function update(){
                var y=window.scrollY||0;
                var delta=y-lastY;
                if(y<=70){nav.classList.remove('nav-hidden');}
                else if(delta>5){nav.classList.add('nav-hidden');}
                else if(delta<-5){nav.classList.remove('nav-hidden');}
                lastY=y;
                ticking=false;
              }
              window.addEventListener('scroll',function(){
                if(!ticking){ticking=true;requestAnimationFrame(update);}
              },{passive:true});
              nav.addEventListener('touchstart',function(){nav.classList.remove('nav-hidden');},{passive:true});
              nav.classList.remove('nav-hidden');
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initNavScroll);else initNavScroll();
          })();
          </script>'''
          s=s.replace('</head>',navfix+'</head>',1)
          glass=r'''<style id="liquid-glass-core">
          :root{--lg-glass:rgba(255,255,255,.065);--lg-line:rgba(255,255,255,.15)}
          html.light{--lg-glass:rgba(255,255,255,.58);--lg-line:rgba(71,85,105,.16)}
          body{background:radial-gradient(circle at 10% 0%,rgba(59,130,246,.13),transparent 32%),radial-gradient(circle at 90% 5%,rgba(168,85,247,.10),transparent 30%),var(--bg)!important}
          .header,.nav-wrap,.stat,.section,.card,.box,.warning,.theme,.nav button,.close{background:linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.035))!important;background-color:var(--lg-glass)!important;border-color:var(--lg-line)!important;box-shadow:0 18px 55px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.14)!important;backdrop-filter:blur(24px) saturate(140%)!important;-webkit-backdrop-filter:blur(24px) saturate(140%)!important}
          .light .header,.light .nav-wrap,.light .stat,.light .section,.light .card,.light .box,.light .warning,.light .theme,.light .nav button,.light .close{background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.40))!important;box-shadow:0 18px 55px rgba(51,65,85,.12),inset 0 1px 0 rgba(255,255,255,.95)!important}
          .nav button{border-radius:999px!important}.section{border-radius:22px!important}.card{border-radius:18px!important}.box{border-radius:13px!important}.theme{border-radius:50%!important}
          .close{background:#dc2626!important;border-color:rgba(255,255,255,.25)!important;color:#fff!important}
          @media(max-width:699px){.nav{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;overflow:visible!important}.nav button{width:100%!important;min-height:43px!important}.section{margin-inline:8px!important}.grid{grid-template-columns:repeat(2,1fr)!important}}
          </style>'''
          s=s.replace('</head>',glass+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify site
        run: |
          set -e
          test -s _site/index.html
          test -s _site/data/ipos.json
          test -s _site/data/listed.json
          test -s _site/data/drhp.json
          test -s _site/data/news.json
          test -s _site/data/last-updated.json
          grep -q 'Promise.all' _site/index.html
          grep -q 'section.opened' _site/index.html
          grep -q 'liquid-glass-core' _site/index.html
          grep -q 'live-date-time' _site/index.html
          grep -q 'Asia/Kolkata' _site/index.html
          grep -q 'nav-scroll-fix' _site/index.html
          grep -q 'data-section="open"' _site/index.html
          ! grep -q 'data-section="brokers"' _site/index.html
          ! grep -q 'section-brokers' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
