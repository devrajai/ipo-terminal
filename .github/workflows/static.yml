name: Deploy IPO Terminal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R data _site/data
          if [ -d scripts ]; then cp -R scripts _site/scripts; fi
          python <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          # Never open any panel automatically after a page refresh.
          s=s.replace('class="section glass opened"', 'class="section glass"')
          s=re.sub(r'<div class="stats">.*?</div>\s*<div id="last-updated"', '<div id="last-updated"', s, flags=re.S)
          s=s.replace('<button class="active" data-section="open">🟢 Open</button>', '<button data-section="open">🟢 Open <span class="status-count" id="nav-open-count">0</span></button>')
          s=s.replace('<button data-section="upcoming">🕐 Upcoming</button>', '<button data-section="upcoming">🕐 Upcoming <span class="status-count" id="nav-upcoming-count">0</span></button>')
          s=s.replace('<button data-section="closed">⚪ Closed</button>', '<button data-section="closed">⚪ Closed <span class="status-count" id="nav-closed-count">0</span></button>')
          s=s.replace('</style>', '.stats{display:none!important}.status-count{display:inline-flex;min-width:20px;height:20px;padding:0 6px;align-items:center;justify-content:center;margin-left:3px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10px;font-weight:950;color:inherit}@media(max-width:699px){.status-count{min-width:18px;height:18px;font-size:9px}}\n.nav button[data-section="open"].active,.nav button[data-section="upcoming"].active,.nav button[data-section="closed"].active{background:var(--glass2)!important;border-color:rgba(255,255,255,.32)!important;color:var(--text)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(0,0,0,.14)!important}\n.nav-wrap{transition:transform .24s ease,opacity .24s ease;will-change:transform}\n.nav-wrap.nav-hidden{transform:translateY(calc(-100% - 10px));opacity:0;pointer-events:none}\n#section-open .grid .box:nth-child(6),#section-upcoming .grid .box:nth-child(6){display:none!important}\n#section-open .actions .link:nth-child(3),#section-upcoming .actions .link:nth-child(3){display:none!important}\n</style>', 1)
          marker="function renderOpen(){"
          inject="""function syncStatusButtons(g){
            const map={open:'nav-open-count',upcoming:'nav-upcoming-count',closed:'nav-closed-count'};
            Object.keys(map).forEach(k=>{const el=document.getElementById(map[k]);if(el)el.textContent=String((g[k]||[]).length)});
          }
          """
          if marker in s and 'function syncStatusButtons' not in s:
              s=s.replace(marker, inject+marker, 1)
          old="countTo(document.getElementById('open-count'),g.open.length);countTo(document.getElementById('upcoming-count'),g.upcoming.length);countTo(document.getElementById('closed-count'),g.closed.length)"
          s=s.replace(old, "syncStatusButtons(g)")
          scroll_js="""
          (function(){
            const nav=document.getElementById('nav-wrap');
            if(!nav) return;
            let lastY=window.scrollY||0;
            const reveal=()=>nav.classList.remove('nav-hidden');
            const hide=()=>{if((window.scrollY||0)>12)nav.classList.add('nav-hidden')};
            window.addEventListener('scroll',()=>{
              const y=window.scrollY||0;
              if(y<=12){reveal();lastY=y;return;}
              const d=y-lastY;
              if(Math.abs(d)<5)return;
              if(d>0)hide();else reveal();
              lastY=y;
            },{passive:true});
            document.addEventListener('touchstart',e=>{if(e.target.closest('#nav-wrap'))reveal();},{passive:true});
            document.addEventListener('click',e=>{if(e.target.closest('#nav-wrap'))reveal();});
          })();
          """
          s=s.replace('</script>', scroll_js+'</script>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify site
        run: |
          set -e
          test -s _site/index.html
          test -s _site/data/ipos.json
          test -s _site/data/listed.json
          test -s _site/data/drhp.json
          test -s _site/data/news.json
          test -s _site/data/last-updated.json
          grep -q 'Promise.all' _site/index.html
          grep -q 'section.opened' _site/index.html
          grep -q 'Asia/Kolkata' _site/index.html
          grep -q 'data-section="open"' _site/index.html
          grep -q 'data-section="tips"' _site/index.html
          grep -q 'data-section="glossary"' _site/index.html
          grep -q 'data-close="open"' _site/index.html
          grep -q 'nav-open-count' _site/index.html
          grep -q 'syncStatusButtons' _site/index.html
          grep -q 'nav-hidden' _site/index.html
          grep -q '#section-open .grid .box:nth-child(6)' _site/index.html
          ! grep -q 'data-section="compare"' _site/index.html
          ! grep -q 'section-compare' _site/index.html
          ! grep -q 'Live Indian IPO information' _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
