name: Deploy IPO Terminal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R data _site/data
          if [ -d scripts ]; then cp -R scripts _site/scripts; fi

      - name: Verify site
        run: |
          set -e
          test -s _site/index.html
          test -s _site/data/ipos.json
          test -s _site/data/listed.json
          test -s _site/data/drhp.json
          test -s _site/data/news.json
          test -s _site/data/last-updated.json
          grep -q 'Promise.all' _site/index.html
          grep -q 'section.active' _site/index.html
          grep -q 'Refresh Now' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
