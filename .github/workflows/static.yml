name: Deploy IPO Terminal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp ui-final-fix.js _site/ui-final-fix.js
          cp ui-hard-fix.js _site/ui-hard-fix.js
          cp -R data _site/data
          cp -R scripts _site/scripts
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'<script\s+src=["\']ui-hard-fix\.js[^>]*></script>', '', html, flags=re.I)
          tag = '<script src="ui-hard-fix.js?v=nav-v5"></script>'
          marker = '</head>'
          pos = html.lower().rfind(marker)
          if pos >= 0:
              html = html[:pos] + tag + html[pos:]
          else:
              html = tag + html
          p.write_text(html, encoding='utf-8')
          PY

      - name: Verify final navigation script is included
        run: |
          set -e
          grep -q 'ui-hard-fix.js?v=nav-v5' _site/index.html
          test -s _site/ui-hard-fix.js
          test -s _site/data/ipo-data.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
