name: Deploy IPO Terminal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp ui-final-fix.js _site/ui-final-fix.js
          cp ui-hard-fix.js _site/ui-hard-fix.js
          cp -R data _site/data
          cp -R scripts _site/scripts
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="ui-hard-fix.js?v=nav-v3"></script>'
          if 'ui-hard-fix.js?v=nav-v3' not in html:
              marker = '</body>'
              pos = html.lower().rfind(marker)
              if pos >= 0:
                  html = html[:pos] + tag + html[pos:]
              else:
                  html += tag
              p.write_text(html, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
