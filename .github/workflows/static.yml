# IPO Terminal — legacy UI + stable desktop/mobile deployment
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -R index.html data scripts _site/
          python - <<'PY'
          import os,re,json
          from pathlib import Path
          root=Path('_site'); index=root/'index.html'; s=index.read_text(encoding='utf-8'); q=os.environ.get('BUILD_SHA','build')[:12]
          # Non-destructive SEO: preserve the complete legacy page and add/refresh metadata.
          seo='''<meta name="description" content="IPO Terminal for Indian IPOs: live and upcoming IPOs, GMP, subscription, SME IPOs, fundamentals, filings and allotment links.">
          <meta name="theme-color" content="#0a0e17">
          <meta property="og:title" content="IPO Terminal — Indian IPO Calendar & Research">
          <meta property="og:description" content="Track Indian IPOs, GMP, subscription, SME IPOs, fundamentals, filings and allotment links.">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://ipo-terminal.is-a.dev/">
          <link rel="canonical" href="https://ipo-terminal.is-a.dev/">'''
          for pat in [r'<meta name="description"[^>]*>',r'<meta name="theme-color"[^>]*>',r'<meta property="og:[^"]+"[^>]*>',r'<link rel="canonical"[^>]*>']:
              s=re.sub(pat,'',s,flags=re.I)
          s=s.replace('</head>',seo+'</head>',1)
          tags=['scripts/ui-enhancements.js','scripts/ipo-calendar.js','scripts/ipo-articles.js','scripts/ipo-shell.js','scripts/ipo-radar.js','scripts/ipo-decision.js','scripts/ipo-radar-proof.js','scripts/ipo-fixes.js','scripts/ipo-final.js','scripts/ipo-subscription-values.js','scripts/ipo-gmp-hidden.js','scripts/ipo-holiday-fix.js','scripts/ipo-nav.js','scripts/ipo-responsive-ui.js','scripts/ipo-live-content.js','scripts/ipo-upgrade.js','scripts/ipo-live-only-fix.js','scripts/ipo-self-heal.js']
          for src in tags:
              s=re.sub(r'<script[^>]+src=["\']'+re.escape(src)+r'(?:\?[^"\']*)?["\'][^>]*></script>','',s,flags=re.I)
              s=s.replace('</body>',f'<script src="{src}?v={q}"></script></body>',1)
          index.write_text(s,encoding='utf-8')
          html=index.read_text(encoding='utf-8')
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html)
          missing=[r.split('?',1)[0] for r in refs if not (root/r.split('?',1)[0]).exists()]
          if missing: raise SystemExit('Missing script files: '+', '.join(missing))
          for datafile in ('ipo-data.json','gmp.json','subscriptions.json','sme-ipos.json'):
              json.loads((root/'data'/datafile).read_text(encoding='utf-8'))
          print('SITE HEALTH OK:',len(refs),'script references checked')
          print('LEGACY UI PRESERVED: no feature/panel deletion')
          print('SEO: description + theme-color + Open Graph + canonical')
          print('UPGRADE: search, GMP, subscriptions, SME, allotment, anchors, UPI copy, timestamp, disclaimer')
          PY
      - name: Validate runtime JavaScript
        run: |
          set -e
          for f in scripts/*.js; do node --check "_site/$f"; done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
