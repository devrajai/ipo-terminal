name: Deploy IPO Terminal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R data _site/data
          if [ -d scripts ]; then cp -R scripts _site/scripts; fi
          python <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')

          # Remove legacy/public navigation items.
          s=re.sub(r'<button[^>]*data-section=["\']documents["\'][^>]*>.*?</button>', '', s, flags=re.S|re.I)
          s=re.sub(r'<button[^>]*>\s*(?:📋\s*)?RHP\s*/\s*DRHP\s*</button>', '', s, flags=re.S|re.I)
          s=re.sub(r'<button[^>]*data-section=["\']compare["\'][^>]*>.*?</button>', '', s, flags=re.S|re.I)
          s=re.sub(r'<section[^>]*id=["\']section-compare["\'][\s\S]*?</section>', '', s, flags=re.S|re.I)
          s=re.sub(r'<section[^>]*id=["\']section-documents["\'][\s\S]*?</section>', '', s, flags=re.S|re.I)

          # Keep selected IPO-status buttons neutral glass.
          s=s.replace('</style>', '.nav button[data-section="open"].active,.nav button[data-section="upcoming"].active,.nav button[data-section="closed"].active{background:var(--glass2)!important;border-color:rgba(255,255,255,.32)!important;color:var(--text)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(0,0,0,.14)!important}\n</style>',1)

          # Open and Upcoming cards do not show allotment or RHP/DRHP actions.
          s=s.replace('</style>', '#section-open .grid .box:nth-child(6),#section-upcoming .grid .box:nth-child(6){display:none!important}\n#section-open .actions .link:nth-child(2),#section-upcoming .actions .link:nth-child(2),#section-open .actions .link:last-child,#section-upcoming .actions .link:last-child{display:none!important}\n</style>',1)

          # No panel opens automatically after refresh.
          s=s.replace('<section id="section-open" class="section glass opened">','<section id="section-open" class="section glass">',1)
          s=s.replace('<button class="active" data-section="open">','<button data-section="open">',1)

          # Remove legacy subtitle and SEBI link.
          s=s.replace('Indian IPO information, listing performance, allotment, RHP / DRHP, news and research','')
          s=re.sub(r'<a[^>]*>\s*SEBI\s*</a>', '', s, flags=re.S|re.I)

          # Hide the three large IPO status summary cards.
          s=s.replace('</style>', '.stats{display:none!important}\n</style>',1)

          # Replace footer using the actual em-dash/en-dash/hyphen variants.
          s=re.sub(r'IPO Terminal\s*[—–-]\s*informational research tool\.?', 'IPO Terminal - By : Dev Raj', s, flags=re.I)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify site
        run: |
          set -e
          test -s _site/index.html
          test -s _site/data/ipos.json
          grep -q 'Asia/Kolkata' _site/index.html
          grep -q 'data-section="open"' _site/index.html
          ! grep -Eiq 'RHP[[:space:]]*/[[:space:]]*DRHP' _site/index.html
          ! grep -q 'data-section="documents"' _site/index.html
          ! grep -q 'section-documents' _site/index.html
          ! grep -q 'data-section="compare"' _site/index.html
          ! grep -q 'section-compare' _site/index.html
          ! grep -q 'Indian IPO information, listing performance, allotment, RHP / DRHP, news and research' _site/index.html
          grep -q 'IPO Terminal - By : Dev Raj' _site/index.html
          grep -q '\.stats{display:none!important}' _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
