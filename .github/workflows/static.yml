# IPO Terminal — responsive desktop/mobile deployment + automatic health checks
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare responsive site and navigation
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -R index.html data scripts _site/
          python - <<'PY'
          import os,re,json
          from pathlib import Path
          root=Path('_site'); index=root/'index.html'; s=index.read_text(encoding='utf-8'); q=os.environ.get('BUILD_SHA','build')[:12]
          for bid in ('b-brk','b-research-lens','lot1-btn','dna-btn','b-intelligence'):
              s=re.sub(r'<button[^>]*id=["\']'+re.escape(bid)+r'["\'][^>]*>.*?</button>','',s,flags=re.S)
          feature_buttons=('''<button class="hb" id="ipc-btn" type="button">IPO Calendar</button>
          <button class="hb" id="ipf-btn" type="button">Decision</button>
          <button class="hb" id="radar-btn" type="button">IPO Radar</button>
          <button class="hb" id="gmp-btn" type="button">Live GMP</button>
          <button class="hb" id="sme-btn" type="button">SME IPOs</button>''')
          s=re.sub(r'<button[^>]*id=["\'](?:ipc-btn|ipf-btn|radar-btn|gmp-btn|sme-btn)["\'][^>]*>.*?</button>','',s,flags=re.S)
          s=s.replace('<div class="hbtns">','<div class="hbtns">'+feature_buttons,1)
          s=re.sub(r'(<button[^>]*id=["\']b-allot["\'][^>]*>)[^<]*(</button>)',r'\1Check Allotment\2',s,flags=re.S)
          seo='''<meta name="description" content="IPO Terminal with IPO calendar, fundamentals, GMP, subscription data, SME IPOs, allotment links, filings and IPO research tools.">
          <meta name="theme-color" content="#0a0e17">
          <meta property="og:title" content="IPO Terminal — Live IPO Calendar, GMP & Fundamentals">
          <meta property="og:description" content="Track Indian IPOs, GMP, subscription, SME IPOs, filings and fundamentals in one terminal.">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://devrajai.github.io/ipo-terminal/">'''
          s=re.sub(r'<meta name="description"[^>]*>','',s,flags=re.I)
          s=s.replace('</head>',seo+'</head>',1)
          responsive_css='''<style id="ipo-responsive-layout">
          @media(min-width:901px){body{padding:8px 18px 18px 266px!important;min-height:100vh}.hbtns{position:fixed!important;left:10px!important;top:82px!important;width:242px!important;max-height:calc(100vh - 96px)!important;overflow-y:auto!important;overflow-x:hidden!important;display:grid!important;grid-template-columns:1fr!important;gap:7px!important;padding:10px!important;margin:0!important;background:var(--card)!important;border:1px solid var(--bd)!important;border-radius:14px!important;box-shadow:0 12px 35px rgba(0,0,0,.30)!important;z-index:9999!important;align-content:start!important}.hbtns .hb{width:100%!important;min-height:40px!important;text-align:left!important;padding:9px 12px!important;white-space:normal!important;margin:0!important}.kpi-row,.panel{width:100%!important;max-width:none!important}.panel{scroll-margin-top:8px!important}.panel-title{position:sticky!important;top:0!important;z-index:20!important}}
          @media(max-width:900px){body{padding:8px!important}.hbtns{position:static!important;width:auto!important;max-height:none!important;overflow-x:auto!important;overflow-y:visible!important;display:flex!important;flex-wrap:nowrap!important;gap:6px!important;margin-top:10px!important;padding:7px!important;-webkit-overflow-scrolling:touch!important;scrollbar-width:none!important}.hbtns::-webkit-scrollbar{display:none}.hbtns .hb{flex:0 0 auto!important;width:auto!important;min-width:112px!important;margin:0!important;text-align:center!important;white-space:nowrap!important;padding:8px 10px!important;font-size:11px!important;min-height:42px!important}}
          #ipc-btn,#ipf-btn,#radar-btn,#gmp-btn,#sme-btn{font-weight:800!important}#ipf-btn{border-color:rgba(34,197,94,.55)!important}#radar-btn{border-color:rgba(168,85,247,.55)!important}#gmp-btn{border-color:rgba(34,197,94,.55)!important}#sme-btn{border-color:rgba(168,85,247,.55)!important}
          </style>'''
          s=s.replace('</style>',responsive_css+'</style>',1)
          tags=['scripts/ui-enhancements.js','scripts/ipo-calendar.js','scripts/ipo-articles.js','scripts/ipo-shell.js','scripts/ipo-radar.js','scripts/ipo-decision.js','scripts/ipo-radar-proof.js','scripts/ipo-fixes.js','scripts/ipo-final.js','scripts/ipo-subscription-values.js','scripts/ipo-gmp-hidden.js','scripts/ipo-holiday-fix.js','scripts/ipo-nav.js','scripts/ipo-responsive-ui.js','scripts/ipo-live-content.js','scripts/ipo-upgrade.js']
          for src in tags:
              s=s.replace(f'<script src="{src}"></script>','')
              tag=f'<script src="{src}?v={q}"></script>'
              if tag not in s:s=s.replace('</body>',tag+'</body>',1)
          index.write_text(s,encoding='utf-8')
          html=index.read_text(encoding='utf-8'); refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html); missing=[r.split('?',1)[0] for r in refs if not (root/r.split('?',1)[0]).exists()]
          if missing: raise SystemExit('Missing script files: '+', '.join(missing))
          for datafile in ('ipo-data.json','gmp.json','subscriptions.json','sme-ipos.json'):
              json.loads((root/'data'/datafile).read_text(encoding='utf-8'))
          nav=(root/'scripts/ipo-nav.js').read_text(encoding='utf-8')
          if 'Decision' not in nav: raise SystemExit('Decision control missing')
          print('SITE HEALTH OK:',len(refs),'script references checked')
          print('FEATURE CONTROLS OK: Calendar, Decision, Radar, Live GMP, SME IPOs')
          print('ALLOTMENT CONTROL: Check Allotment')
          print('SEO: description + theme-color + Open Graph tags')
          print('UPGRADE: search, GMP, subscriptions, SME, anchors, UPI copy, timestamp, disclaimer')
          PY
      - name: Validate runtime JavaScript
        run: |
          set -e
          files="scripts/ui-enhancements.js scripts/ipo-calendar.js scripts/ipo-articles.js scripts/ipo-radar.js scripts/ipo-decision.js scripts/ipo-radar-proof.js scripts/ipo-shell.js scripts/ipo-fixes.js scripts/ipo-final.js scripts/ipo-subscription-values.js scripts/ipo-gmp-hidden.js scripts/ipo-holiday-fix.js scripts/ipo-nav.js scripts/ipo-responsive-ui.js scripts/ipo-live-content.js scripts/ipo-upgrade.js"
          for f in $files; do node --check "_site/$f"; done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
