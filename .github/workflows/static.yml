# Simple workflow for deploying static content to GitHub Pages
# Older IPO Terminal UI + stable independent analysis buttons
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Repair feature JavaScript syntax
        run: |
          for f in scripts/ipo-fundamentals.js scripts/ipo-dna.js scripts/ipo-radar.js scripts/ipo-nav.js; do
            sed -i "s/String(v==null?'')/String(v==null?'':v)/g" "$f"
          done
      - name: Validate feature JavaScript
        run: |
          node --check scripts/ipo-fundamentals.js
          node --check scripts/ipo-dna.js
          node --check scripts/ipo-radar.js
          node --check scripts/ipo-nav.js
      - name: Prepare site with UI enhancements
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R index.html data scripts _site/
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          q=os.environ.get('BUILD_SHA','build')[:12]
          s=re.sub(r'<button[^>]*id=["\']b-brk["\'][^>]*>.*?</button>', '', s, flags=re.S)
          s=re.sub(r'<button[^>]*id=["\']b-research-lens["\'][^>]*>.*?</button>', '', s, flags=re.S)
          marker='</div></div><div class="kpi-row">'
          feature_buttons=('<button class="hb" id="ipf-btn" type="button">IPO Fundamentals</button>'
                           '<button class="hb" id="dna-btn" type="button">IPO DNA</button>'
                           '<button class="hb" id="radar-btn" type="button">IPO Radar</button>'
                           '<button class="hb" id="lot1-btn" type="button">Lot Decision</button>')
          if 'id="ipf-btn"' not in s:
              s=s.replace(marker,feature_buttons+marker,1)
          grid_css='''<style>
          .hbtns{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px!important;align-items:stretch!important}
          .hbtns .hb{width:100%!important;min-width:0!important;margin:0!important;text-align:center!important;white-space:normal!important}
          .hbtns .lot-decision-btn{width:100%!important}
          @media(max-width:700px){.hbtns{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px!important}.hbtns .hb{padding:8px 5px!important;font-size:11px!important;min-height:42px!important}}
          </style>'''
          s=s.replace('</style>',grid_css+'</style>',1)
          tags=['scripts/ui-enhancements.js','scripts/ipo-calendar.js','scripts/ipo-articles.js','scripts/ipo-intelligence.js','scripts/ipo-radar.js','scripts/ipo-shell.js','scripts/ipo-fundamentals.js','scripts/ipo-dna.js','scripts/ipo-fixes.js','scripts/ipo-final.js','scripts/ipo-subscription-values.js','scripts/ipo-gmp-hidden.js','scripts/ipo-holiday-fix.js','scripts/ipo-nav.js']
          for src in tags:
              tag=f'<script src="{src}?v={q}"></script>'
              s=s.replace(f'<script src="{src}"></script>','')
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
