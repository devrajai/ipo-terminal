name: Deploy IPO Terminal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp nav-core.js _site/nav-core.js
          cp -R data _site/data
          cp -R scripts _site/scripts
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          # Remove the two legacy UI patch scripts from the deployed document.
          html = re.sub(r'<script\s+src=["\'][^"\']*ui-(?:hard-fix|final-fix)\.js[^>]*></script>', '', html, flags=re.I)
          # Remove any old cache-busting variants too.
          html = re.sub(r'<script\s+src=["\'][^"\']*nav-core\.js[^>]*></script>', '', html, flags=re.I)
          tag = '<script src="nav-core.js?v=nav-core-1"></script>'
          marker = '</body>'
          pos = html.lower().rfind(marker)
          if pos >= 0:
              html = html[:pos] + tag + html[pos:]
          else:
              html += tag
          p.write_text(html, encoding='utf-8')
          PY

      - name: Verify single navigation core
        run: |
          set -e
          test -s _site/nav-core.js
          test -s _site/data/ipo-data.json
          test "$(grep -oi 'nav-core.js?v=nav-core-1' _site/index.html | wc -l)" -eq 1
          test "$(grep -Eio 'ui-(hard-fix|final-fix)\.js' _site/index.html | wc -l)" -eq 0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
