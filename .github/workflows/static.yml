# IPO Terminal — responsive UI + stable GitHub Pages deployment
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -R index.html data scripts _site/

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('_site')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          # Remove Broker navigation button while preserving its source content.
          html = html.replace(
              '<button class="hb" data-panel="p-brk">🏦 Brokers</button>',
              ''
          )

          # Two-column navigation on both mobile and laptop/desktop.
          html = html.replace(
              'display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:hidden;',
              'display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible;'
          )
          html = html.replace(
              '.hb{flex:0 0 auto;white-space:nowrap;',
              '.hb{width:100%;white-space:nowrap;'
          )

          index.write_text(html, encoding='utf-8')

          # Validate every local script reference.
          refs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
          missing = []
          for ref in refs:
              path = ref.split('?', 1)[0]
              if path.startswith(('http://', 'https://', '//')):
                  continue
              if not (root / path).exists():
                  missing.append(path)

          if missing:
              raise SystemExit('Missing script files: ' + ', '.join(missing))

          # Validate required JSON files.
          for datafile in (
              'ipo-data.json',
              'gmp.json',
              'subscriptions.json',
              'sme-ipos.json',
          ):
              path = root / 'data' / datafile
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty data file: {path}')
              json.loads(path.read_text(encoding='utf-8'))

          last_updated = root / 'data' / 'last-updated.json'
          if last_updated.exists():
              json.loads(last_updated.read_text(encoding='utf-8'))

          print('SITE HEALTH OK:', len(refs), 'local script references checked')
          print('BROKER NAVIGATION: removed')
          print('NAVIGATION: two columns')
          print('DATA: required JSON files validated')
          PY

      - name: Validate inline JavaScript
        run: |
          set -e
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('_site/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Inline script blocks:', len(scripts))
          PY
          node --check /tmp/index-inline.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
