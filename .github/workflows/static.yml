# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site with UI enhancements
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R index.html data scripts _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="scripts/ui-enhancements.js"></script>',
              '<script src="scripts/ipo-calendar.js"></script>',
              '<script src="scripts/ipo-articles.js"></script>',
              '<script src="scripts/ipo-intelligence.js"></script>',
              '<script src="scripts/ipo-analyst.js"></script>',
              '<script src="scripts/ipo-radar.js"></script>',
              '<script src="scripts/ipo-shell.js"></script>',
              '<script src="scripts/ipo-fundamentals.js"></script>',
              '<script src="scripts/ipo-dna.js"></script>',
              '<script src="scripts/ipo-fixes.js"></script>',
              '<script src="scripts/ipo-final.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
