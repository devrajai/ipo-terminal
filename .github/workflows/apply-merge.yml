name: Apply merge-tools

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-merge
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wire merge-tools into index.html
        run: python3 scripts/apply-merge-tools.py

      - name: Commit if changed (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: single Smart Tools button (Decision + Coach + Pro Tools)"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then exit 0; fi
              sleep 5
            done
            echo "push failed after retries"; exit 1
          fi
