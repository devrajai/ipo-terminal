name: Apply terminal fixes

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-terminal-fixes
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply patches
        run: python3 scripts/apply-sarvam-fixes.py

      - name: Verify JavaScript syntax
        run: |
          set -e
          python3 - <<'PY'
          import re
          src = open('index.html', encoding='utf-8').read()
          m = re.findall(r'<script>(.*?)</script>', src, re.S)
          open('/tmp/inline.js', 'w', encoding='utf-8').write(m[0])
          PY
          node --check /tmp/inline.js
          for f in scripts/*.js; do node --check "$f"; done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit - patches already applied"
          else
            git commit -m "fix: IPO cards, decision sheet runtime, tips 17-25, broker_health mangle bug"
            git push
          fi
