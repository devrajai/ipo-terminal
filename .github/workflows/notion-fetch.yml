name: Notion Fetch
on:
  schedule:
    - cron: "0 3 * * *"   # 08:30 IST daily (after the Notion database update at 08:00 IST)
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest IPO data from Notion
        run: node scripts/fetch-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Commit updated data/notion-data.json
        run: |
          git config user.name "ipo-bot"
          git config user.email "actions@github.com"
          git add data/notion-data.json
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Update Notion IPO data $(date -u +%F)"
            git push
          fi
